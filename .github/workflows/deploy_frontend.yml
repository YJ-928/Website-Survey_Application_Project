name: Build & Deploy Frontend

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | \
          docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Frontend Image
        run: |
          docker build -t ashokeminds/we:fe-${{ github.sha }} .
          docker tag ashokeminds/we:fe-${{ github.sha }} ashokeminds/we:fe-latest

      - name: Push Frontend Image
        run: |
          docker push ashokeminds/we:fe-${{ github.sha }}
          docker push ashokeminds/we:fe-latest

      - name: Deploy Frontend via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --parameters commands="[
              \"cd /home/ubuntu\",
              \"echo '${{ secrets.DOCKERHUB_PASSWORD }}' | docker login -u '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin\",
              \"echo 'Stopping existing container'\",
              \"docker rm -f react-frontend || true\",
              \"echo 'Removing old images'\",
              \"docker rmi ashokeminds/we-fe:latest || true\",
              \"docker pull ashokeminds/we:fe-latest\",
              \"docker compose up -d --no-deps --force-recreate frontend\"
            ]" \
            --query Command.CommandId \
            --output text \
            --region ${{ secrets.AWS_REGION }})

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region ${{ secrets.AWS_REGION }}

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region ${{ secrets.AWS_REGION }}
